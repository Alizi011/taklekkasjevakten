name: Validate historical TLV customer alerts
on:
  push:
    branches: [fix/tlv-legacy-customer-message-alerts-20261124]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify old threads do not create action warnings
        run: node --experimental-strip-types --test tests/notifications/customer-message-alerts.test.mjs
      - name: Typecheck and production build
        run: npm run build
