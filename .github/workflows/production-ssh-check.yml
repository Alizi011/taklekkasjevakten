name: Production SSH Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ssh-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production

    steps:
      - name: Configure SSH
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.TLV_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.TLV_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          test -n "$KNOWN_HOSTS"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Verify one.com connection
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/id_ed25519" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            c2d9sf1au_ssh@ssh.c2d9sf1au.service.one \
            'test -s /webroots/www/index.html &&
             test -d /webroots/www/assets &&
             echo "SSH OK - production files untouched"'