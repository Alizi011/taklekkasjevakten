name: Validate TLV integration build
on:
  push:
    branches:
      - integration/tlv-prod-core-20261123
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Typecheck and build
        run: npm run build
      - name: Confirm deployment remains disabled
        run: |
          test -s dist/index.html
          echo 'INTEGRATION_BUILD_ONLY_NO_DEPLOYMENT'
