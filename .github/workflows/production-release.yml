name: Production Frontend Release

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Velg handling"
        required: true
        type: choice
        default: preflight
        options: [preflight, backup, publish, rollback]
      release_sha:
        description: "40-tegns SHA for staged frontend (preflight/backup/publish)"
        required: false
        type: string
      backup_name:
        description: "Eksakt backupfilnavn (rollback)"
        required: false
        type: string
      backup_sha256:
        description: "SHA256 fra logg ved backup (rollback)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: tlv-production-operations
  cancel-in-progress: false

jobs:
  operate:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate parameters
        shell: bash
        env:
          TLV_ACTION: ${{ inputs.action }}
          TLV_RELEASE_SHA: ${{ inputs.release_sha }}
          TLV_BACKUP_NAME: ${{ inputs.backup_name }}
          TLV_BACKUP_SHA: ${{ inputs.backup_sha256 }}
        run: |
          set -euo pipefail
          case "$TLV_ACTION" in
            preflight|backup|publish)
              [[ "$TLV_RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
              ;;
            rollback)
              [[ "$TLV_BACKUP_NAME" =~ ^tlv-before-github-[0-9]{8}-[0-9]{6}(-[0-9]+)?\.tar\.gz$ ]] || exit 1
              [[ "$TLV_BACKUP_SHA" =~ ^[a-f0-9]{64}$ ]] || exit 1
              ;;
            *) exit 1 ;;
          esac
      - name: Configure verified SSH
        shell: bash
        env:
          KEY: ${{ secrets.TLV_DEPLOY_SSH_KEY }}
          HOST_KEY: ${{ vars.TLV_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$KEY" && test -n "$HOST_KEY"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$HOST_KEY" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Execute controlled frontend operation
        shell: bash
        env:
          TLV_ACTION: ${{ inputs.action }}
          TLV_RELEASE_SHA: ${{ inputs.release_sha }}
          TLV_BACKUP_NAME: ${{ inputs.backup_name }}
          TLV_BACKUP_SHA: ${{ inputs.backup_sha256 }}
          TLV_ENABLE_LIVE: ${{ vars.TLV_ENABLE_LIVE }}
          TLV_FUNCTIONAL_TEST_OK: ${{ vars.TLV_FUNCTIONAL_TEST_OK }}
        run: |
          set -euo pipefail
          # The two environment variables default to "no" until explicitly enabled
          # after functional testing. They are passed as a controlled remote prefix.
          [[ "$TLV_ENABLE_LIVE" == yes ]] || TLV_ENABLE_LIVE=no
          [[ "$TLV_FUNCTIONAL_TEST_OK" == yes ]] || TLV_FUNCTIONAL_TEST_OK=no
          REMOTE="c2d9sf1au_ssh@ssh.c2d9sf1au.service.one"
          SSH=(ssh -i "$HOME/.ssh/id_ed25519" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes)
          if [[ "$TLV_ACTION" == rollback ]]; then
            ARG="$TLV_BACKUP_NAME"
            HASH="$TLV_BACKUP_SHA"
          else
            ARG="$TLV_RELEASE_SHA"
            HASH=""
          fi
          # Variables are regex-validated, so remote values cannot inject commands.
          "${SSH[@]}" "$REMOTE" \
            "TLV_ENABLE_LIVE=$TLV_ENABLE_LIVE TLV_FUNCTIONAL_TEST_OK=$TLV_FUNCTIONAL_TEST_OK bash -s -- '$TLV_ACTION' '$ARG' '$HASH'" \
            < .github/scripts/tlv-frontend-deploy.sh
