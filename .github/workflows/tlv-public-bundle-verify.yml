name: Verify live public TLV photo tab bundle (read only)
on:
  push:
    branches: [main]
    paths: [.github/workflows/tlv-public-bundle-verify.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect public site JavaScript without authentication or production credentials
        shell: bash
        run: |
          set -euo pipefail
          for host in taklekkasjevakten.no www.taklekkasjevakten.no;do
            echo "PUBLIC_HOST=$host"
            html="$(curl -fsSL --max-time 30 -H 'Cache-Control: no-cache' "https://$host/admin?photo_tab_check=20261124")"
            asset="$(grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' <<<"$html" | head -1)"
            echo "PUBLIC_ASSET=$asset"
            test -n "$asset"
            curl -fsSL --max-time 30 -H 'Cache-Control: no-cache' "https://$host/$asset" -o /tmp/tlv-public.js
            echo "PUBLIC_JS_SHA256=$(sha256sum /tmp/tlv-public.js|cut -d' ' -f1)"
            if grep -qF 'Importerte prosjektbilder fra Perun Core' /tmp/tlv-public.js;then
              echo 'PHOTO_TAB_MARKER=present'
            else
              echo 'PHOTO_TAB_MARKER=missing'
            fi
            if grep -qF 'Bildevalg for kunde og markedsføring' /tmp/tlv-public.js;then
              echo 'LEGACY_PHOTO_CHOICES_MARKER=present'
            fi
          done
